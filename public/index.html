<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Início - Sistema de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Notas da FATEC</h1>
        <h2>Desenvolvimento Web III</h2>
        <p>Informe as variáveis de avaliação diretamente pela URL do seu navegador:</p>
        <code>/media?p1=[NOTA_P1]&p2=[NOTA_P2]&nome=[NOME_DO_ALUNO]</code>
        
        <p style="margin-top: 20px;"><strong>Exemplo prático de acesso:</strong></p>
        <a href="http://localhost:3000/media?p1=7.5&p2=5.0&nome=Pedro" target="_blank">Testar: /media?p1=7.5&p2=5.0&nome=Pedro</a>
    </div>
</body>
</html>
